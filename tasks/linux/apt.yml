---
# Setup APT repositories and GPG keys

- name: Install APT repository prerequisites
  become: true
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: false
    lock_timeout: 300

- name: Create keyrings directory
  become: true
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Install GPG keys from URLs
  become: true
  ansible.builtin.shell: |
    {% if item.key_dearmor | default(false) %}
    curl -fsSL "{{ item.key_url }}" | gpg --dearmor -o "/etc/apt/keyrings/{{ item.key_filename }}.gpg"
    {% else %}
    curl -fsSL "{{ item.key_url }}" -o "/etc/apt/keyrings/{{ item.key_filename }}.gpg"
    {% endif %}
    chmod 0644 "/etc/apt/keyrings/{{ item.key_filename }}.gpg"
  args:
    creates: "/etc/apt/keyrings/{{ item.key_filename }}.gpg"
  loop: "{{ apt_repositories }}"
  when: item.key_url is defined

- name: Add APT repositories
  become: true
  ansible.builtin.apt_repository:
    repo: "{{ item.repo }}"
    filename: "{{ item.filename }}"
    state: present
    update_cache: false
  loop: "{{ apt_repositories }}"

- name: Find cached Google Cloud APT indexes
  become: true
  ansible.builtin.find:
    paths: /var/lib/apt/lists
    patterns: "packages.cloud.google.com*"
    file_type: file
    recurse: true
  register: google_cloud_apt_indexes

- name: Remove cached Google Cloud APT indexes
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ google_cloud_apt_indexes.files }}"

- name: Update APT cache
  become: true
  ansible.builtin.apt:
    update_cache: true
    update_cache_retries: 5
    update_cache_retry_max_delay: 15
    lock_timeout: 300

- name: Repair broken APT dependencies
  become: true
  ansible.builtin.apt:
    state: fixed
    lock_timeout: 300
