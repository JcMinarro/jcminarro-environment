---
# Compare against the actual downloaded bundle, not an assumed release/version mapping.
- name: Explain ElegooSlicer check mode
  ansible.builtin.debug:
    msg: "ElegooSlicer bundle comparison requires downloading the DMG; skipped in check mode."
  when: ansible_check_mode
  tags: [elegooslicer]

- name: Install or update ElegooSlicer
  when: not ansible_check_mode
  tags: [elegooslicer]
  block:
    - name: Create temp directory for DMG
      ansible.builtin.tempfile:
        state: directory
        suffix: .elegooslicer
      register: elegooslicer_tmp
      changed_when: false

    - name: Download ElegooSlicer DMG
      ansible.builtin.get_url:
        url: "{{ elegooslicer_macos_url }}"
        dest: "{{ elegooslicer_tmp.path }}/ElegooSlicer.dmg"
      changed_when: false

    - name: Validate and safely replace ElegooSlicer when needed
      ansible.builtin.script:
        cmd: '{{ (role_path ~ "/files/macos_elegooslicer.py") | quote }} {{ (elegooslicer_tmp.path ~ "/ElegooSlicer.dmg") | quote }}'
        executable: "{{ ansible_facts['python']['executable'] }}"
      register: elegooslicer_install
      changed_when: "'ELEGOOSLICER_CHANGED' in elegooslicer_install.stdout"

  always:
    - name: Clean up downloaded DMG
      ansible.builtin.file:
        path: "{{ elegooslicer_tmp.path }}"
        state: absent
      when: elegooslicer_tmp is defined and elegooslicer_tmp.path is defined
      changed_when: false
